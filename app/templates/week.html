<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Task Scheduler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="planner-page">

    <!-- Top header -->
    <header class="planner-header">
        <h1>
            Weekly Planner
            <span class="header-subtitle">plan your week ahead</span>
        </h1>
    </header>

    <!-- Week View -->
    <section class="week-section">
        <div class="week-nav">
            <a href="{{ url_for('week_view', week_start=prev_week) }}" class="week-link">
                ← Previous
            </a>
        
            <div class="week-range">
                <span>{{ week_range_display }}</span>
            </div>
            
            <a href="{{ url_for('week_view', week_start=next_week) }}" class="week-link">
                Next →
            </a>
        </div>

        <div class="week-view">
            {% for day, tasks in week_tasks.items() %}
            <section class="week-day day-{{ day|lower }} {% if is_current_week and loop.index0 == today_index %}today{% endif %}">
                <header class="week-day-header">
                    <h3>{{ day|capitalize }}</h3>
                </header>

                <!-- Task list -->
                <ul class="task-list">
                    {% for task in tasks %}
                    <li class="task-row">
                        <div class="task-content">
                            <!-- Click the task to reveal delete -->
                            <button
                                type="button"
                                class="task-toggle {{ task.color_class }}"
                                onclick="toggleDelete(this)"
                            >
                                {{ task.task }}
                            </button>

                            <form method="POST" 
                                  action="{{ url_for('delete_task_route', task_id=task.id) }}"
                                  class="delete-form">
                                <button type="submit" class="delete-button">🗑️</button>
                                <input type="hidden" name="week_start" value="{{ week_start }}">
                            </form>
                        </div>
                    </li>
                    {% else %}
                    <li class="empty-state">No tasks yet</li>
                    {% endfor %}
                </ul>

                <!-- Add task for this specific day -->
                <div class="add-task-area collapsed" data-day="{{ day|lower }}">
                    <!-- Collapsed state: round + button -->
                    <button type="button"
                            class="add-trigger"
                            onclick="toggleAddTask(this)">
                        +
                    </button>

                    <!-- Expanded state: input + submit -->
                    <form method="POST"
                          action="{{ url_for('add_task_for_day', day=day|lower) }}"
                          class="task-form-inline">
                        <input type="hidden" name="week_start" value="{{ week_start }}">
                        <input type="text"
                               name="task"
                               placeholder="Add a task"
                               required
                               list="task-suggestions-{{ day }}">
                        <button type="submit" class="btn-add-task">+</button>
                    </form>

                    <!-- Suggestions from existing tasks in DB -->
                    <datalist id="task-suggestions-{{ day }}">
                        {% for name in task_names %}
                            <option value="{{ name }}"></option>
                        {% endfor %}
                    </datalist>
                </div>
            </section>
            {% endfor %}
        </div>
    </section>

</div>

<script>
    function toggleDelete(taskButton) {
        const row = taskButton.closest('.task-content');
        if (!row) return;
        row.classList.toggle('show-delete');
    }
    
    function toggleAddTask(triggerButton) {
        const area = triggerButton.closest('.add-task-area');
        if (!area) return;
    
        // close any other open add boxes first
        document.querySelectorAll('.add-task-area.expanded').forEach(openArea => {
            if (openArea !== area) {
                collapseAddTask(openArea);
            }
        });
    
        area.classList.remove('collapsed');
        area.classList.add('expanded');
    
        const input = area.querySelector('input[name="task"]');
        if (input) input.focus();
    }
    
    function collapseAddTask(area) {
        if (!area) return;
        area.classList.remove('expanded');
        area.classList.add('collapsed');
    }
    
    document.addEventListener('click', function(event) {
        document.querySelectorAll('.add-task-area.expanded').forEach(area => {
            if (!area.contains(event.target)) {
                const input = area.querySelector('input[name="task"]');
                if (input && input.value.trim() === '') {
                    collapseAddTask(area);
                }
            }
        });
    });
    
    document.querySelectorAll('.add-task-area input[name="task"]').forEach(input => {
        input.addEventListener('blur', function() {
            const area = input.closest('.add-task-area');
            if (!area) return;
    
            // small delay so clicking the submit button still works
            setTimeout(() => {
                const active = document.activeElement;
                if (area.contains(active)) return;
    
                if (input.value.trim() === '') {
                    collapseAddTask(area);
                }
            }, 100);
        });
    });
    </script>

</body>
</html>
