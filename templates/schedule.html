<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <title>My Schedule</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Today's Schedule</h1>
    <ul>
        {% for task in tasks %}
            <li>
                <strong>{{ task.time }}</strong> — {{ task.task }}
                <form method="POST" action="/tasks/delete/{{ task.id }}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this task?');">
                    <button type="submit" class="delete-button">Delete</button>
                </form>
            </li>
        {% else %}
            <li>No tasks yet!</li>
        {% endfor %}
    </ul>
    <h2>Add a New Task</h2>
<form method="POST" action="/tasks/form-add">
    <label for="time">Time:</label>
    <input type="text" id="time" name="time" placeholder="HH:MM" required>
    <br>
    <label for="task">Task:</label>
    <input type="text" id="task" name="task" placeholder="Task description" required>
    <br>
    <button type="submit">Add Task</button>
</form>
</body>
</html>
