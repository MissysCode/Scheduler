<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <title>My Schedule</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Today's Schedule</h1>
    <ul>
        {% for task in tasks %}
            <li class="task-item">
                <span class="task-time">{{ task.time }}</span>
                <span class="task-text">{{ task.task }}</span>
                <form method="POST" action="/tasks/delete/{{ task.id }}" onsubmit="return confirm('Are you sure you want to delete this task?');">
                    <button type="submit" class="delete-button">Delete</button>
                </form>
            </li>
        {% else %}
            <li>No tasks yet!</li>
        {% endfor %}
    </ul>
    <h2>Add a New Task</h2>
<form method="POST" action="/tasks/form-add" class="task-form">
    <label for="time">Time:</label>
    <input type="time" id="time" name="time" required pattern="[0-9]{2}:[0-9]{2}">
    <br>
    <label for="task">Task:</label>
    <input type="text" id="task" name="task" placeholder="Task description" required>
    <br>
    <button type="submit">Add Task</button>
</form>
</body>
</html>
